services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: commission
      POSTGRES_PASSWORD: commission
      POSTGRES_DB: commission
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - commission_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commission -d commission"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  commission_data:
