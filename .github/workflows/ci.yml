name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: commission
          POSTGRES_PASSWORD: commission
          POSTGRES_DB: commission_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U commission -d commission_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://commission:commission@localhost:5432/commission_test
      TEST_DATABASE_URL: postgresql://commission:commission@localhost:5432/commission_test
      SHOP_CURRENCY: USD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker build --tag esports-commission-app:local .
      - run: node scripts/container-smoke.mjs
      - name: Export verified amd64 image
        working-directory: .cache
        run: |
          docker tag esports-commission-app:local esports-commission-app:sha-${{ github.sha }}
          docker save esports-commission-app:sha-${{ github.sha }} --output esports-commission-app-amd64.tar
          sha256sum esports-commission-app-amd64.tar > image.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: synology-app-amd64-${{ github.sha }}
          path: |
            .cache/esports-commission-app-amd64.tar
            .cache/image.sha256
          retention-days: 7
          compression-level: 0
